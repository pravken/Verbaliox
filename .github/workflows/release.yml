name: Release

# Builds the Verbaliox.exe launcher from build_exe.py on a clean Windows runner and publishes
# it together with a source archive and SHA-256 checksums, so every binary can be traced to a commit.
#
# Three jobs, each on its own runner, so the signing key never shares a runner with third-party code:
#   test          packages from PyPI (hash-locked requirements-test.txt) and the unit tests; no secrets
#   build         the standard library and the runner's tools only (no pip install): launcher, zip,
#                 installer, SHA256SUMS.txt; uploaded as the workflow artifact
#   sign-publish  only with a tag: a fresh runner checks the artifact against SHA256SUMS.txt, signs it
#                 with RELEASE_SIGNING_KEY, checks the signature with the app's key and publishes.
#                 No pip install: it runs only tools/release_key.py and tools/release_notes.py (stdlib).
on:
  push:
    tags:
      - "v*"
  # Run by hand: without a tag only test and build (artifacts to try out, nothing signed or published);
  # with a tag, e.g. v0.2.0-beta.1, also creates that tag on the commit it ran for and publishes the release
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag to create and publish (empty: build only)"
        required: false
        default: ""

# Each job asks for what it needs; only sign-publish can write
permissions:
  contents: read

jobs:
  test:
    runs-on: windows-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4.4.0
        with:
          persist-credentials: false

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # v5.6.0
        with:
          python-version: "3.11"

      # Without the app's packages most tests skip themselves; with them every test runs.
      # Every package (transitive ones too) is pinned with its hashes (requirements-test.in)
      - name: Install test dependencies
        run: python -m pip install --require-hashes -r requirements-test.txt

      - name: Run unit tests
        shell: pwsh
        run: |
          $out = python -m unittest discover -v -s tests -t . 2>&1 | Out-String
          Write-Output $out
          if ($LASTEXITCODE -ne 0) { throw "Unit tests failed" }
          # A test may skip itself for a missing tool (FFmpeg), never for a missing Python package
          if ($out -match "skipped '[^']*not installed") { throw "Tests were skipped: a package is missing from requirements-test.txt" }

  build:
    needs: test
    runs-on: windows-latest
    permissions:
      contents: read
    env:
      TAG: ${{ inputs.tag || github.ref_name }}
      PUBLISH: ${{ startsWith(github.ref, 'refs/tags/') || inputs.tag != '' }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4.4.0
        with:
          persist-credentials: false

      # The standard library only: nothing is installed with pip in this job
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # v5.6.0
        with:
          python-version: "3.11"

      # The app compares its own version with the latest release tag (app/updater.py)
      - name: Check that the tag matches app/__init__.py
        if: env.PUBLISH == 'true'
        shell: pwsh
        run: |
          $v = python -c "import re; print(re.search(r'__version__ = \x22(.+?)\x22', open('app/__init__.py').read()).group(1))"
          if ("v$v" -ne "$env:TAG") { throw "Tag $env:TAG does not match __version__ $v" }

      - name: Build launcher (csc.exe from .NET Framework)
        run: python build_exe.py

      - name: Package release
        shell: pwsh
        run: |
          $name = "Verbaliox-$($env:TAG -replace '[\\/]', '-')"
          git archive --format=zip --prefix="$name/" -o source.zip HEAD
          Expand-Archive source.zip -DestinationPath dist
          Copy-Item Verbaliox.exe "dist/$name/"
          Compress-Archive -Path "dist/$name" -DestinationPath "$name.zip"
          # The same folder as one installer (installer/verbaliox.iss, Inno Setup 6): the runner image
          # has it, else it comes from Chocolatey at a fixed version (this runner holds no secret)
          $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          if (-not (Test-Path $iscc)) {
            choco install innosetup --version=6.4.3 -y --no-progress
            if ($LASTEXITCODE -ne 0) { throw "Installing Inno Setup failed" }
          }
          $ver = $env:TAG.TrimStart('v') -replace '[\\/:*?"<>|]', '-'  # a build without a tag carries the branch name
          $num = ($ver -split '-')[0]
          if ($num -notmatch '^\d+(\.\d+){0,3}$') { $num = '0.0.0' }
          & $iscc /Q "/DAppVersion=$ver" "/DNumericVersion=$num" "/DSourceDir=$PWD\dist\$name" "/DOutputDir=$PWD" installer\verbaliox.iss
          if ($LASTEXITCODE -ne 0) { throw "Building the installer failed" }
          $setup = Get-ChildItem "Verbaliox-Installer-*.exe" | Select-Object -First 1
          Get-FileHash Verbaliox.exe, "$name.zip", $setup.FullName -Algorithm SHA256 |
            ForEach-Object { "$($_.Hash.ToLower())  $(Split-Path $_.Path -Leaf)" } |
            Set-Content -Encoding utf8 SHA256SUMS.txt
          Get-Content SHA256SUMS.txt

      # Unsigned: the signature is added by sign-publish on its own runner (a build without a tag stays unsigned)
      - name: Upload build artifacts
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02  # v4.6.2
        with:
          name: verbaliox-release
          if-no-files-found: error
          path: |
            Verbaliox-*.zip
            Verbaliox-Installer-*.exe
            Verbaliox.exe
            SHA256SUMS.txt

  sign-publish:
    needs: build
    # Only a release: a build without a tag never brings the signing key onto a runner
    if: startsWith(github.ref, 'refs/tags/') || inputs.tag != ''
    runs-on: windows-latest
    permissions:
      contents: write
    env:
      TAG: ${{ inputs.tag || github.ref_name }}
      PUBLISH: ${{ startsWith(github.ref, 'refs/tags/') || inputs.tag != '' }}
    steps:
      # tools/release_key.py, tools/release_notes.py, app/updater.py (the public key) and CHANGELOG.md of this commit
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4.4.0
        with:
          persist-credentials: false

      # The standard library only: nothing is installed with pip in this job
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # v5.6.0
        with:
          python-version: "3.11"

      - name: Download build artifacts
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093  # v4.3.0
        with:
          name: verbaliox-release
          path: release

      # Every file is the one the build job summed, and nothing else came with them
      - name: Check the files against SHA256SUMS.txt
        shell: pwsh
        working-directory: release
        run: |
          $listed = @{}
          foreach ($raw in Get-Content SHA256SUMS.txt) {
            $line = $raw.TrimStart([char]0xFEFF)
            if (-not $line.Trim()) { continue }
            if ($line -notmatch '^([0-9a-f]{64})  (\S+)$') { throw "SHA256SUMS.txt has an unexpected line: $line" }
            $listed[$Matches[2]] = $Matches[1]
          }
          $present = @(Get-ChildItem -File -Recurse | ForEach-Object Name | Where-Object { $_ -ne 'SHA256SUMS.txt' })
          if ($listed.Count -ne 3) { throw "SHA256SUMS.txt lists $($listed.Count) files, not 3" }
          foreach ($n in $present) { if (-not $listed.ContainsKey($n)) { throw "$n is not in SHA256SUMS.txt" } }
          foreach ($n in $listed.Keys) {
            if (-not (Test-Path -LiteralPath $n)) { throw "$n is missing" }
            $h = (Get-FileHash -LiteralPath $n -Algorithm SHA256).Hash.ToLower()
            if ($h -ne $listed[$n]) { throw "$n does not match SHA256SUMS.txt" }
            Write-Output "OK  $n"
          }

      # SHA256SUMS.txt signed with the author's release key (docs/release-signing.md). Once its public
      # key is in app/updater.py, installed apps take only signed releases: then a missing secret stops
      # the release instead of publishing one nobody could install.
      - name: Sign checksums
        shell: pwsh
        working-directory: release
        env:
          RELEASE_SIGNING_KEY: ${{ secrets.RELEASE_SIGNING_KEY }}
        run: |
          $hasKey = Select-String -Path ../app/updater.py -Pattern '^RELEASE_PUBLIC_KEY = ".+"' -Quiet
          if ($env:RELEASE_SIGNING_KEY) {
            python ../tools/release_key.py sign SHA256SUMS.txt --tag $env:TAG
            if ($LASTEXITCODE -ne 0) { throw "Signing failed" }
            if ($hasKey) {
              python ../tools/release_key.py verify SHA256SUMS.txt --tag $env:TAG
              if ($LASTEXITCODE -ne 0) { throw "The signature does not check out with the key in app/updater.py" }
            }
          } elseif ($hasKey -and $env:PUBLISH -eq 'true') {
            throw "app/updater.py has a release key but the RELEASE_SIGNING_KEY secret is missing: installed apps would refuse this release"
          } else {
            Write-Output "No release key yet: SHA256SUMS.txt is not signed"
          }

      # With the gh tool of the runner: no third-party action gets the token that writes releases.
      # v1.2.0-beta.1 and the like are pre-releases: releases/latest (the in-app update check) skips
      # them, so only people who download them by hand get them
      - name: Publish GitHub release
        if: env.PUBLISH == 'true'
        shell: pwsh
        working-directory: release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          $files = @(Get-ChildItem Verbaliox-*.zip, Verbaliox-Installer-*.exe | ForEach-Object Name) + @('Verbaliox.exe', 'SHA256SUMS.txt')
          if (Test-Path SHA256SUMS.txt.minisig) { $files += 'SHA256SUMS.txt.minisig' }
          # @(...) keeps these arrays: an if returning one item gives a plain string, and splatting a
          # string passes its characters one by one (a beta's --prerelease became "-", "-", "p", …)
          $pre = @(if ($env:TAG.Contains('-')) { '--prerelease' })
          # The page's text: the version's section of CHANGELOG.md, or GitHub's list of commits
          # (written outside release/, so it can never be taken for a release file)
          python ../tools/release_notes.py $env:TAG ../notes.md
          $notes = @(if ((Get-Item ../notes.md).Length -gt 0) { '--notes-file', '../notes.md' } else { '--generate-notes' })
          gh release view $env:TAG *> $null
          if ($LASTEXITCODE -eq 0) { gh release upload $env:TAG @files --clobber }
          else { gh release create $env:TAG @files --target $env:GITHUB_SHA --title $env:TAG @notes @pre }
          if ($LASTEXITCODE -ne 0) { throw "Publishing the release failed" }
