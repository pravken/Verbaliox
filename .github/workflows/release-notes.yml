name: Release notes

# Writes the text of published release pages again from CHANGELOG.md (tools/release_notes.py: the
# English section first). Only the text changes: the files, the tag and the signature stay as published.
on:
  workflow_dispatch:
    inputs:
      tags:
        description: "Release tags, separated by spaces (e.g. v0.7.0-beta.1 v0.6.0-beta.4)"
        required: true

permissions:
  contents: write

jobs:
  notes:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0  # v7.1.0
        with:
          python-version: "3.11"

      - name: Write the notes of each tag
        env:
          GH_TOKEN: ${{ github.token }}
          TAGS: ${{ inputs.tags }}
        run: |
          for tag in $TAGS; do
            case "$tag" in v[0-9]*) ;; *) echo "skip $tag: not a release tag"; continue ;; esac
            python tools/release_notes.py "$tag" notes.md
            if [ ! -s notes.md ]; then echo "skip $tag: no section in CHANGELOG.md"; continue; fi
            gh release edit "$tag" --notes-file notes.md
            echo "$tag: notes written"
          done
