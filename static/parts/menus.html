<!-- The theatre (full-window video) and the context menus: part of static/index.html (assembled by app/page.py) -->
  <!-- =========================================================================
       THEATRE MODE: large video with the transcript beside or below it.
       The existing <video>, the transcript pane and the player bar are moved in here
       (like the mini preview), so playback, highlighting and click-to-seek keep working.
       ========================================================================= -->
  <div id="theatre" class="hidden fixed inset-0 z-40 bg-apple-bg flex flex-col">
    <div class="h-10 px-4 flex items-center justify-between gap-3 border-b apple-border shrink-0 bg-apple-sidebar/95">
      <div id="theatre-title" class="text-xs font-semibold text-white truncate min-w-0"></div>
      <div class="flex items-center gap-1.5 shrink-0">
        <!-- In the "Subtitles" layout the text language menu moves here from the hidden text pane -->
        <div id="theatre-lang-slot" class="flex items-center"></div>
        <div class="apple-segmented" style="height: 26px;">
          <button data-click="setTheatreLayout" data-click-args='["side"]' id="theatre-layout-side" class="apple-segment-btn text-[11.5px]" data-i18n="theatreSide">Текст справа</button>
          <button data-click="setTheatreLayout" data-click-args='["below"]' id="theatre-layout-below" class="apple-segment-btn text-[11.5px]" data-i18n="theatreBelow">Текст снизу</button>
          <button data-click="setTheatreLayout" data-click-args='["subs"]' id="theatre-layout-subs" class="apple-segment-btn text-[11.5px]" data-i18n="theatreSubs">Субтитры</button>
        </div>
        <button data-click="toggleTheatreFullscreen" id="theatre-fs-btn" class="ui-btn ui-btn-subtle h-7 px-2.5 text-[11.5px]" data-i18n="theatreFullscreen">Во весь экран</button>
        <button data-click="exitTheatre" class="ui-btn ui-btn-subtle h-7 px-2.5 text-[11.5px]" data-i18n-title="tipTheatreExit" title="Выйти из режима кинотеатра (Esc)">
          <span data-i18n="theatreExit">Закрыть</span> <kbd class="ml-1 text-[11px] font-mono text-apple-tertiary">Esc</kbd>
        </button>
      </div>
    </div>
    <div id="theatre-body" class="flex-1 min-h-0 flex">
      <div id="theatre-video-slot" class="flex-1 min-w-0 min-h-0 bg-black flex items-center justify-center">
        <!-- "Subtitles" layout: the phrase being spoken, over the picture -->
        <div id="theatre-caption" class="theatre-caption hidden" aria-live="off"></div>
      </div>
      <div id="theatre-text-slot" class="min-w-0 min-h-0 flex flex-col bg-apple-bg"></div>
    </div>
    <div id="theatre-footer-slot" class="shrink-0"></div>
  </div>

  <!-- =========================================================================
       RIGHT-CLICK CONTEXT MENU (Sidebar Recording Items)
       Four groups: the recording · its text (with «Экспорт ›» and «Нарезка ›») · «Ещё ›» · delete. The submenus
       stand after the menu and are wired by vxSubmenus (static/js/menus.js) through data-submenu on their rows.
       ========================================================================= -->
  <div id="recording-context-menu" class="hidden fixed w-56 macos-menu z-50" data-click="stopEvent" data-click-args='[{"$": "event"}]'>
    <div id="ctx-title-header" class="px-2.5 py-1 text-[11.5px] font-semibold text-apple-secondary truncate border-b border-white/10 mb-1"></div>

    <button data-click="ctxOpenInfo" data-i18n-title="tbRecInfo" title="Сведения" class="macos-menu-item">
      <span data-i18n="tbRecInfo">Сведения</span><span class="tm-key">Ctrl+I</span>
    </button>
    <button data-click="ctxRenameRecording" data-i18n-title="tipCtxRename" title="Изменить название выбранной записи" class="macos-menu-item">
      <span data-i18n="ctxRename">Переименовать…</span><span class="tm-key">F2</span>
    </button>
    <button data-click="ctxMoveToFolder" data-click-args='[{"$": "event"}]' data-i18n-title="tbRecMove" title="Переместить в папку" class="macos-menu-item">
      <span data-i18n="tbRecMove">Переместить в папку</span>
    </button>
    <button data-click="openSeriesMenu" data-click-args='[{"$": "event"}]' class="macos-menu-item" data-i18n-title="tipSeriesMenu" title="Серия повторяющихся встреч: те же люди, та же тема">
      <span data-i18n="ctxSeries">Серия встреч…</span><span id="ctx-series-name" class="text-[11px] opacity-80 truncate max-w-[90px]"></span>
    </button>

    <div class="macos-menu-sep"></div>
    <button data-click="ctxOpenReconfigureModal" data-i18n-title="tipCtxReconfigure" title="Изменить модель Whisper или число участников и запустить заново" class="macos-menu-item">
      <span data-i18n="ctxReconfigure">Расшифровать заново…</span>
    </button>
    <button id="ctx-cancel-item" data-click="ctxCancelProcessing" data-i18n-title="tipCtxCancel" title="Остановить распознавание этой записи" class="macos-menu-item hidden">
      <span data-i18n="ctxCancel">Отменить обработку</span>
    </button>
    <button id="ctx-restore-item" data-click="ctxRestoreSegments" data-i18n-title="tipCtxRestore" title="Вернуть исходный текст распознавания" class="macos-menu-item hidden">
      <span data-i18n="ctxRestore">Вернуть текст до очистки</span>
    </button>
    <button id="ctx-sub-export-btn" data-submenu="ctx-sub-export" aria-haspopup="menu" aria-expanded="false" aria-controls="ctx-sub-export" class="macos-menu-item">
      <span data-i18n="export">Экспорт</span><span class="vx-sub-chev" aria-hidden="true">›</span>
    </button>
    <button id="ctx-sub-cut-btn" data-submenu="ctx-sub-cut" aria-haspopup="menu" aria-expanded="false" aria-controls="ctx-sub-cut" class="macos-menu-item">
      <span data-i18n="ctxCutGroup">Нарезка</span><span class="vx-sub-chev" aria-hidden="true">›</span>
    </button>

    <div class="macos-menu-sep"></div>
    <button id="ctx-sub-more-btn" data-submenu="ctx-sub-more" aria-haspopup="menu" aria-expanded="false" aria-controls="ctx-sub-more" class="macos-menu-item">
      <span data-i18n="ctxMore">Ещё</span><span class="vx-sub-chev" aria-hidden="true">›</span>
    </button>

    <div class="macos-menu-sep"></div>
    <button data-click="ctxDeleteRecording" data-i18n-title="tipCtxDelete" title="Безвозвратно удалить запись из списка" class="macos-menu-item macos-menu-item-danger">
      <span data-i18n="ctxDelete">Удалить запись</span>
    </button>
  </div>

  <!-- The submenus of the recording's menu (shown beside their row by vxSubmenus in static/js/menus.js) -->
  <div id="ctx-sub-export" role="menu" aria-labelledby="ctx-sub-export-btn" class="hidden fixed macos-menu vx-submenu z-50" data-click="stopEvent" data-click-args='[{"$": "event"}]'>
    <button data-click="ctxExport" data-click-args='["docx"]' data-i18n-title="tipExportDocx" title="Экспортировать в Microsoft Word (.docx)" role="menuitem" class="macos-menu-item"><span>DOCX</span></button>
    <button data-click="ctxExport" data-click-args='["md"]' data-i18n-title="tipExportMd" title="Экспортировать в Markdown (.md)" role="menuitem" class="macos-menu-item"><span>MD</span></button>
    <button data-click="ctxExport" data-click-args='["srt"]' data-i18n-title="tipExportSrt" title="Экспортировать субтитры (.srt)" role="menuitem" class="macos-menu-item"><span>SRT</span></button>
  </div>
  <div id="ctx-sub-cut" role="menu" aria-labelledby="ctx-sub-cut-btn" class="hidden fixed macos-menu vx-submenu z-50" data-click="stopEvent" data-click-args='[{"$": "event"}]'>
    <button data-click="ctxCut" data-click-args='["clean"]' data-i18n-title="tipCutClean" title="Копия записи без пауз и слов-паразитов" role="menuitem" class="macos-menu-item">
      <span data-i18n="ctxCutClean">Без пауз</span>
    </button>
    <button data-click="ctxCut" data-click-args='["highlights"]' data-i18n-title="tipCutHighlights" title="Короткая сборка из ключевых моментов: решения, выводы, задачи" role="menuitem" class="macos-menu-item">
      <span data-i18n="ctxCutHighlights">Ключевые моменты</span>
    </button>
  </div>
  <div id="ctx-sub-more" role="menu" aria-labelledby="ctx-sub-more-btn" class="hidden fixed macos-menu vx-submenu z-50" data-click="stopEvent" data-click-args='[{"$": "event"}]'>
    <button data-click="ctxImportTeamsVtt" data-i18n-title="tipCtxTeamsVtt" title="Расшифровка, которую Teams сохраняет после встречи: имена участников и их реплики" role="menuitem" class="macos-menu-item">
      <span data-i18n="ctxTeamsVtt">Добавить расшифровку Teams (.vtt)…</span>
    </button>
    <button data-click="ctxRevealInExplorer" data-i18n-title="tipCtxReveal" title="Открыть папку с исходным медиафайлом в Проводнике Windows" role="menuitem" class="macos-menu-item">
      <span data-i18n="ctxReveal">Показать файл в папке</span>
    </button>
    <div class="macos-menu-sep"></div>
    <button data-click="ctxClearResults" data-i18n-title="tipClearResults" title="Удалить расшифровку, участников, саммари, переводы и задачи; звук и ваши заметки остаются, запись можно расшифровать заново" role="menuitem" class="macos-menu-item">
      <span data-i18n="ctxClearResults">Удалить результаты</span>
    </button>
    <button data-click="ctxRemoveMedia" data-i18n-title="tipRemoveMedia" title="Удалить звук и видео записи, оставив расшифровку, анализ и заметки" role="menuitem" class="macos-menu-item">
      <span data-i18n="ctxRemoveMedia">Удалить звук, оставить текст</span>
    </button>
  </div>

  <!-- Folder menu in the library (openFolderMenu in static/js/library.js) -->
  <div id="folder-context-menu" class="hidden fixed w-52 macos-menu z-50" data-click="stopEvent" data-click-args='[{"$": "event"}]'>
    <div id="fctx-title" class="px-2.5 py-1 text-[11.5px] font-semibold text-apple-secondary truncate border-b border-white/10 mb-1"></div>
    <button data-click="fctxRename" class="macos-menu-item"><span data-i18n="folderRename">Переименовать…</span></button>
    <button data-click="fctxNewSubfolder" class="macos-menu-item"><span data-i18n="folderNewSub">Новая вложенная папка…</span></button>
    <!-- the place of the folder: into another folder or to the top level (also by dragging it in «Записи → Папки») -->
    <button id="fctx-move" data-click="fctxMove" data-click-args='[{"$": "event"}]' class="macos-menu-item"><span data-i18n="folderMoveTo">Переместить в…</span></button>
    <button data-click="fctxAsk" class="macos-menu-item"><span data-i18n="folderAsk">Спросить по папке…</span></button>
    <button data-click="fctxDigest" class="macos-menu-item"><span data-i18n="folderDigest">Дайджест папки</span></button>
    <div class="my-1 border-t border-white/10"></div>
    <button id="fctx-delete" data-click="fctxDelete" class="macos-menu-item macos-menu-item-danger"><span data-i18n="folderDelete">Удалить папку</span></button>
  </div>

  <!-- All the models, opened from the tile under the hardware in the sidebar (renderModelsPop in static/js/settings.js) -->
  <div id="models-pop" class="models-pop hidden" role="dialog" data-i18n-aria="mpTitle" aria-label="Модели"></div>
