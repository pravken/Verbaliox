<!-- «Сегодня» (docs/pult-plan.md, stage 3; static/js/today.js with static/js/home.js): part of static/parts/workspace.html.
     The head: the date as a calendar sheet, the period shown, its figures in pills, «Календарь» День · Неделя · Месяц.
     The day: the meetings of the working day (recorded by themselves when the user wants) and the cards of the day on
     the right; a week or a month: the calendar over the width, the cards in a row under it. -->
    <div id="home-view" class="hidden flex-1 min-h-0 overflow-y-auto bg-apple-bg">
      <div class="td-wrap">
        <header class="td-head">
          <span id="td-tile" class="td-tile" aria-hidden="true"><small id="td-tile-k"></small><b id="td-tile-n"></b></span>
          <div class="td-title">
            <h1 id="td-title" data-i18n="tdToday">Сегодня</h1>
            <span id="td-sub" class="td-sub"></span>
          </div>
          <span id="td-pills" class="td-pills"></span>
          <span class="td-grow"></span>
          <div class="td-tools">
          <span id="td-nav" class="td-nav hidden">
            <button class="cal-nav" data-click="tdNav" data-click-args='[-1]' data-i18n-title="calPrev" title="Назад" data-i18n-aria="calPrev" aria-label="Назад">‹</button>
            <button class="cal-today-btn" data-click="tdNav" data-click-args='[0]' data-i18n="calToday">Сегодня</button>
            <button class="cal-nav" data-click="tdNav" data-click-args='[1]' data-i18n-title="calNext" title="Вперёд" data-i18n-aria="calNext" aria-label="Вперёд">›</button>
          </span>
          <span class="td-cap" data-i18n="tdCalendar">Календарь</span>
          <div id="td-spans" class="tk-seg" role="radiogroup" data-i18n-aria="tdCalendar" aria-label="Календарь"></div>
          </div>
        </header>
        <div id="td-untx"></div>

        <div id="td-body" class="td-body">
          <div class="td-main">
            <section id="td-day" class="hm-card">
              <div class="hm-card-head">
                <h2 data-i18n="hmMeetings">Встречи сегодня</h2><span id="hm-mt-count" class="hm-cnt hidden"></span><span class="flex-1"></span>
                <div class="relative hm-day-wrap">
                  <button id="hm-day-btn" data-click="hmToggleDay" data-click-args='[{"$": "event"}]' class="hm-chip" aria-expanded="false" data-i18n-title="hmDayTip" title="Рабочий день — какие часы показывать">
                    <svg class="w-3 h-3" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><circle cx="12" cy="12" r="8.5"/><path d="M12 7.5V12l3 2"/></svg>
                    <span id="hm-day-range" class="hm-mono"></span>
                    <svg class="w-2.5 h-2.5" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M6 9l6 6 6-6"/></svg>
                  </button>
                  <div id="hm-day-pop" class="hm-pop hidden" role="dialog" data-click="stopEvent" data-click-args='[{"$": "event"}]'>
                    <div class="text-[13px] font-semibold text-white" data-i18n="hmWorkDay">Рабочий день</div>
                    <div class="flex items-center gap-2 text-[12.5px] text-apple-secondary">
                      <span data-i18n="hmFrom">с</span>
                      <select id="hm-day-start" data-change="hmSetDay" class="hm-select" data-i18n-title="hmDayStartTip" title="Начало рабочего дня"></select>
                      <span data-i18n="hmTo">до</span>
                      <select id="hm-day-end" data-change="hmSetDay" class="hm-select" data-i18n-title="hmDayEndTip" title="Конец рабочего дня"></select>
                    </div>
                    <span id="hm-overnight" class="hm-overnight hidden"></span>
                    <div id="hm-presets" class="flex flex-wrap gap-1.5"></div>
                    <label class="hm-check"><input id="hm-fit" type="checkbox" role="switch" class="vs-switch" data-change="hmSetFit" data-change-args='[{"$": "checked"}]' /><span data-i18n="hmFit">Расширять, если встреча выходит за эти часы</span></label>
                  </div>
                </div>
              </div>
              <div id="hm-cal-off" class="hm-cal-off hidden">
                <span data-i18n="hmCalOff">Подключите календарь, чтобы видеть встречи дня и записывать их автоматически.</span>
                <button data-click="openModal" data-click-args='["settings", "calendar"]' class="hm-link" data-i18n="hmCalConnect">Подключить календарь</button>
              </div>
              <div id="hm-cal-on">
                <div id="hm-auto" class="hm-auto">
                  <button id="hm-auto-sw" role="switch" aria-checked="false" data-click="hmToggleAutoAll" class="vs-track" data-i18n-title="hmAutoAll" title="Автозапись всех встреч"></button>
                  <span class="flex-1 min-w-0 flex flex-col gap-0.5"><b class="text-[12.5px] font-semibold text-white" data-i18n="hmAutoAll">Автозапись всех встреч</b><span id="hm-auto-sub" class="hm-note"></span></span>
                  <label id="hm-ask-wrap" class="hm-check hidden" data-i18n-title="hmAskTip" title="Встречи без ссылки на звонок: перед началом программа спросит, записывать ли с микрофона">
                    <input id="hm-ask-inperson" type="checkbox" role="switch" class="vs-switch" data-change="hmSetAskInPerson" data-change-args='[{"$": "checked"}]' /><span data-i18n="hmAskInPerson">очные — спросить</span></label>
                </div>
                <div id="hm-timeline" class="hm-timeline"></div>
              </div>
            </section>
            <!-- a week or a month (calBodyHtml in static/js/home.js, the same as the calendar window) -->
            <section id="td-cal" class="hm-card td-cal hidden"></section>
          </div>

          <div class="td-side">
            <div id="td-cards" class="td-cards"></div>
            <section id="hm-work-card" class="hm-card hidden">
              <div class="hm-card-head"><h2 data-i18n="hmInWork">В работе</h2><span class="flex-1"></span><span class="hm-note" data-i18n="hmInWorkNote">идёт и в свёрнутом окне</span></div>
              <div id="hm-queue" class="flex flex-col"></div>
            </section>
          </div>
        </div>
      </div>
    </div>
