<!-- The status bar under the whole window (renderStatusbar in static/js/shell.js): part of static/index.html.
     On the left the load of the computer with the program's own share (a click opens #load-pop: the processor,
     the memory, the video card and the models in memory), on the right the queue (a click opens #jobs-pop,
     the same window as «Очередь» on the rail; static/js/pult.js) and before it a new version (#upd-pill). Above it: the question before an in-person
     meeting and the dictation of the home page (static/js/home.js). -->
  <footer id="app-statusbar" class="statusbar" role="status">
    <button data-click="toggleLoadPop" id="sb-load" class="sb-load" aria-haspopup="dialog" aria-expanded="false"
      data-i18n-title="sbLoadTip" title="Процессор, память и модели в памяти">
      <span id="sb-load-dot" class="sb-dot" aria-hidden="true"></span><span id="sb-load-lead" class="sb-load-lead"></span>
      <span class="sb-sep" aria-hidden="true"></span><span class="sb-k">CPU</span><span class="ld-bar" aria-hidden="true"><b id="sb-cpu-all"></b><i id="sb-cpu-own"></i></span><span id="sb-cpu" class="sb-num"></span>
      <span class="sb-k">RAM</span><span class="ld-bar" aria-hidden="true"><b id="sb-ram-all"></b><i id="sb-ram-own"></i></span><span id="sb-ram" class="sb-num"></span>
      <!-- the video memory, when the computer has an NVIDIA card (hidden otherwise) -->
      <span id="sb-gpu-g" class="sb-gpu-g hidden"><span class="sb-k">GPU</span><span class="ld-bar" aria-hidden="true"><b id="sb-gpu-all"></b><i id="sb-gpu-own"></i></span><span id="sb-gpu" class="sb-num"></span></span>
    </button>
    <button data-click="openStatusbarDownloads" data-click-args='[{"$": "event"}]' id="sb-dl" class="sb-queue sb-dl hidden" data-i18n-title="tipSbDownloads" title="Скачивание моделей: открыть список моделей"></button>
    <span class="flex-1"></span>
    <!-- A new version: stays in sight until it is installed (app.js renderUpdatePill); a click opens what is new -->
    <button id="upd-pill" data-click="openUpdateDialog" class="upd-pill hidden" type="button">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 19V5M6 11l6-6 6 6"/></svg>
      <span id="upd-pill-text" class="truncate"></span>
    </button>
    <!-- the economy mode (app/economy.py): a click turns it off -->
    <button data-click="economyOff" id="sb-economy" class="sb-queue sb-economy hidden" data-i18n-title="sbEconomyTip" title="Расшифровка, анализ и субтитры ждут. Нажмите, чтобы выключить">Только запись</button>
    <button data-click="openStatusbarQueue" id="sb-queue" class="sb-queue" aria-haspopup="dialog" data-i18n-title="sbQueueTip" title="Открыть очередь"></button>
  </footer>

  <!-- «Нагрузка» and «Очередь»: windows of one design, opened next to what was clicked (static/js/pult.js) -->
  <div id="load-pop" class="vx-panel vx-panel-load hidden" role="dialog" aria-labelledby="load-pop-title"></div>
  <div id="jobs-pop" class="vx-panel hidden" role="dialog" aria-labelledby="jobs-pop-title"></div>

  <!-- Before an in-person meeting with the automatic recording on: record it from the microphone? -->
  <div id="hm-ask" class="hm-ask hidden" role="alertdialog" aria-labelledby="hm-ask-title">
    <div class="flex items-start gap-3">
      <span class="hm-ask-icon" aria-hidden="true"><svg class="w-4 h-4" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="8.5"/><path d="M12 7.5V12l3 2"/></svg></span>
      <span class="flex-1 flex flex-col gap-1 min-w-0">
        <b id="hm-ask-title" class="text-[13.5px] font-semibold text-white"></b>
        <span id="hm-ask-text" class="text-[12.5px] leading-snug text-apple-label"></span>
      </span>
      <button data-click="hmAskAnswer" data-click-args='[null]' class="hm-x" data-i18n-title="tipCloseModal" title="Закрыть окно">✕</button>
    </div>
    <div class="flex gap-2">
      <button data-click="hmAskAnswer" data-click-args='[true]' class="hm-ask-yes" data-i18n="hmAskRecord">● Записать</button>
      <button data-click="hmAskAnswer" data-click-args='[false]' class="hm-ask-no" data-i18n="hmAskNotNow">Не сейчас</button>
    </div>
    <button data-click="hmAskNever" class="hm-ask-never" data-i18n="hmAskNever" data-i18n-title="tipHmAskNever"
      title="Не предлагать записывать эту встречу и следующие встречи этой серии. Вернуть можно на главной: щелчок по «Никогда» у встречи">Никогда для этой встречи и её повторов</button>
    <span class="text-[11.5px] text-apple-tertiary" data-i18n="hmAskWarn">Предупредите участников, что идёт запись.</span>
  </div>

  <!-- Dictation from the home page: while it listens, then the text it heard -->
  <div id="hm-dict" class="hm-dict hidden" role="status">
    <span id="hm-dict-lvl" class="hm-lvl" aria-hidden="true"><span></span><span></span><span></span><span></span></span>
    <span class="flex flex-col gap-0.5 min-w-0">
      <b id="hm-dict-title" class="text-[13.5px] font-semibold text-white"></b>
      <span id="hm-dict-text" class="hm-dict-text"></span>
    </span>
    <button id="hm-dict-done" data-click="hmDictToggle" class="hm-ask-yes hm-dict-btn" data-i18n="hmDictDone">Готово</button>
    <button id="hm-dict-copy" data-click="hmDictCopy" class="hm-ask-yes hm-dict-btn hidden" data-i18n="hmDictCopy">Копировать</button>
    <button id="hm-dict-cancel" data-click="hmDictCancel" class="hm-ask-no hm-dict-btn" data-i18n="cancel">Отмена</button>
  </div>
