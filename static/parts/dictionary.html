<!-- «Словарь»: a section of its own at the bottom of the rail (static/js/dictionary.js, docs/pult-plan.md stage 6):
     part of static/parts/workspace.html. The words as the main card (a compact row to add one, the groups as
     filters, each word with its variants, group, recordings, switch, edit and delete); on the right the words
     suggested by corrections in the recordings, the correction by sound and what the features are. -->
    <div id="dict-view" class="hidden flex-1 min-h-0 dc-view">
      <header class="dc-head vx-shead">
        <span class="dc-head-ic vx-stile" aria-hidden="true"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M12 6.5C10.5 5.3 8.3 4.8 4 5v13c4.3-.2 6.5.3 8 1.5 1.5-1.2 3.7-1.7 8-1.5V5c-4.3-.2-6.5.3-8 1.5z"/><path d="M12 6.5v13"/></svg></span>
        <div class="dc-head-text vx-stext"><h1 class="dc-title" data-i18n="dictionary">Словарь</h1><p id="dc-sub" class="dc-sub vx-ssub"></p></div>
        <span class="tk-grow"></span>
        <div class="tk-head-actions">
          <!-- No «Добавить слово» here (found in the audit: two «Добавить» one under the other): a word is added in one
               way, by the row at the top of «Слова», always open under the head -->
          <!-- the search last, at the right edge of the head: one place and width in every section -->
          <label class="tk-search">
            <svg aria-hidden="true" width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="#8E8E93" stroke-width="2.2" stroke-linecap="round"><circle cx="11" cy="11" r="6.5"/><path d="M20 20l-4.2-4.2"/></svg>
            <input id="dc-q" type="search" data-input="onDictSearch" data-input-args='[{"$": "value"}]'
                   data-i18n-placeholder="dcSearch" placeholder="Найти слово" data-i18n-title="dcSearch" title="Найти слово">
          </label>
        </div>
      </header>
      <div class="dc-body"><div class="dc-col">
        <div class="dc-mcol">
        <!-- The words: a compact row to add one (the word, how it may be recognized, its group), the groups as
             filters, each word with its variants, group, recordings, switch, edit and delete -->
        <section class="pcard dc-main">
          <h3 class="pcd-h"><span class="pcd-ic"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 6.5C10.5 5.3 8.3 4.8 4 5v13c4.3-.2 6.5.3 8 1.5 1.5-1.2 3.7-1.7 8-1.5V5c-4.3-.2-6.5.3-8 1.5z"/><path d="M12 6.5v13"/></svg></span><span class="pcd-t"><span data-i18n="dcWords">Слова</span><b id="dc-count" class="pcd-n"></b></span><span id="dc-clear-slot" class="pcd-side"></span></h3>
          <p class="dc-hint"><span data-i18n="dcHint">Имена, термины и названия, которые нужно писать правильно.</span>
            <button type="button" class="dc-more" data-i18n="dcMore" data-i18n-title="rdSasDictDesc" title="Whisper получает слова словаря как подсказку при распознавании; после распознавания слово заменяется по вариантам и по похожему звучанию. Модели анализа и перевода пишут слова так же и не переводят их. Уже расшифрованные записи не меняются.">Подробнее</button></p>
          <div class="dc-add">
            <input id="settings-dict-term" type="text" class="tk-input" data-keydown="onEnter" data-keydown-args='[{"$": "event"}, "addSettingsDictItem"]' data-input="checkSettingsDictTerm"
              data-i18n-placeholder="rdSasDictTermPh" placeholder="Слово или фраза" data-i18n-title="rdSasDictTermPh" title="Слово или фраза">
            <input id="settings-dict-variants" type="text" class="tk-input" data-keydown="onEnter" data-keydown-args='[{"$": "event"}, "addSettingsDictItem"]'
              data-i18n-placeholder="dictVariantsPh" placeholder="Варианты распознавания" data-i18n-title="dictVariantsTip" title="Через запятую — как модель может услышать это слово">
            <input id="settings-dict-cat" type="text" class="tk-input" list="dc-groups" data-keydown="onEnter" data-keydown-args='[{"$": "event"}, "addSettingsDictItem"]'
              data-i18n-placeholder="rdSasDictCatPh" placeholder="Группа терминов (необязательно)" data-i18n-title="dcGroupTip" title="Группа объединяет слова в списке словаря: по группам работают фильтры над списком. Поле необязательное.">
            <datalist id="dc-groups"></datalist>
            <button id="settings-dict-add" data-click="addSettingsDictItem" class="tk-btn tk-btn-primary"><svg class="vx-plus" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M12 5v14M5 12h14"/></svg><span data-i18n="rdSasDictAdd">Добавить</span></button>
          </div>
          <div id="settings-dict-dup" class="dict-dup hidden" role="status" data-i18n="rdSasDictDup">Это слово уже есть в словаре</div>
          <div id="dc-words"></div>
        </section>
        </div><div class="dc-scol">
        <!-- Corrections made by hand in the recordings, not in the dictionary yet -->
        <section id="dc-offers" class="pcard hidden"></section>
        <!-- The correction by sound (the setting dictionary_fuzzy) -->
        <section class="pcard">
          <h3 class="pcd-h"><span class="pcd-ic"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 7h10M18 7h2M4 17h4M12 17h8"/><circle cx="16" cy="7" r="2"/><circle cx="10" cy="17" r="2"/></svg></span><span class="pcd-t" data-i18n="dcCorrection">Исправление</span></h3>
          <label class="vs-row settings-toggle cursor-pointer text-xs text-apple-label">
            <span><span data-i18n="dictFuzzyToggle">Исправлять похожие по звучанию слова</span>
              <span class="block text-[11.5px] text-apple-tertiary leading-snug mt-0.5" data-i18n="dictFuzzyHint">После распознавания слово, которое звучит как слово из словаря, заменяется им.</span></span>
            <input type="checkbox" role="switch" class="vs-switch" id="set-dict-fuzzy" checked />
          </label>
        </section>
        <!-- What each feature is (static/js/features.js): every field has a use, none is required -->
        <section class="pcard">
          <h3 class="pcd-h"><span class="pcd-ic"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 12V5a1 1 0 011-1h7l8 8-8 8z"/><circle cx="8.5" cy="8.5" r="1.3"/></svg></span><span class="pcd-t" data-i18n="ftDictTitle">Фичи</span><span class="pcd-side"><button type="button" id="dc-ft-open" class="dc-ft-link" data-click="toggleFeatureDrawer" aria-haspopup="dialog" data-i18n="dcFtOpen">В отдельном окне</button></span></h3>
          <p class="dc-note" data-i18n="ftDictDesc">Что это за фичи и как о них говорят.</p>
          <div class="flex items-center gap-2">
            <input id="ft-dict-new" type="text" maxlength="60" data-keydown="onEnter" data-keydown-args='[{"$": "event"}, "addDictFeature"]'
              data-i18n-placeholder="ftNewPh" placeholder="Новая фича…" data-i18n-title="ftNewPh" title="Новая фича…" class="tk-input flex-1 min-w-0">
            <button data-click="addDictFeature" class="tk-btn tk-btn-primary" data-i18n="ftCreate">Создать</button>
          </div>
          <div id="ft-dict-list" class="space-y-2 dc-ft-list"></div>
          <label class="vs-row settings-toggle cursor-pointer text-xs text-apple-label">
            <span><span data-i18n="ftSuggestToggle">Предлагать фичу новой записи</span>
              <span class="block text-[11.5px] text-apple-tertiary leading-snug mt-0.5" data-i18n="ftSuggestHint">По названию встречи, а если в нём фичи нет — моделью анализа.</span></span>
            <input type="checkbox" role="switch" class="vs-switch" id="set-feature-suggest" checked />
          </label>
        </section>
        </div>
      </div></div>
    </div>
