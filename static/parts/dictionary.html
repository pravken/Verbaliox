<!-- «Словарь»: a section of its own at the bottom of the rail (static/js/dictionary.js, docs/pult-plan.md stage 6):
     part of static/parts/workspace.html. A new word with its variants and group; the words suggested by
     corrections in the recordings; the words by group, how many recordings hold each, each switched on alone;
     the correction by sound; what the features are. -->
    <div id="dict-view" class="hidden flex-1 min-h-0 dc-view">
      <header class="dc-head">
        <span class="dc-head-ic" aria-hidden="true"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M12 6.5C10.5 5.3 8.3 4.8 4 5v13c4.3-.2 6.5.3 8 1.5 1.5-1.2 3.7-1.7 8-1.5V5c-4.3-.2-6.5.3-8 1.5z"/><path d="M12 6.5v13"/></svg></span>
        <div class="dc-head-text"><h1 class="dc-title" data-i18n="dictionary">Словарь</h1><p id="dc-sub" class="dc-sub"></p></div>
        <span class="tk-grow"></span>
        <label class="tk-search">
          <svg aria-hidden="true" width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="#8E8E93" stroke-width="2.2" stroke-linecap="round"><circle cx="11" cy="11" r="6.5"/><path d="M20 20l-4.2-4.2"/></svg>
          <input id="dc-q" type="search" data-input="onDictSearch" data-input-args='[{"$": "value"}]'
                 data-i18n-placeholder="dcSearch" placeholder="Найти слово" data-i18n-title="dcSearch" title="Найти слово">
        </label>
      </header>
      <div class="dc-body"><div class="dc-col">
        <!-- A new word: the word, how it may be recognized (comma separated), its group -->
        <section class="pcard">
          <h3 class="pcd-h"><span class="pcd-ic"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 6.5C10.5 5.3 8.3 4.8 4 5v13c4.3-.2 6.5.3 8 1.5 1.5-1.2 3.7-1.7 8-1.5V5c-4.3-.2-6.5.3-8 1.5z"/><path d="M12 6.5v13"/></svg></span><span class="pcd-t" data-i18n="dcNewWord">Новое слово</span></h3>
          <p class="dc-note" data-i18n="rdSasDictDesc">Имена, термины и названия, которые нужно писать правильно.</p>
          <div class="dc-add">
            <input id="settings-dict-term" type="text" class="tk-input" data-keydown="onEnter" data-keydown-args='[{"$": "event"}, "addSettingsDictItem"]' data-input="checkSettingsDictTerm"
              data-i18n-placeholder="rdSasDictTermPh" placeholder="Слово или фраза" data-i18n-title="rdSasDictTermPh" title="Слово или фраза">
            <input id="settings-dict-variants" type="text" class="tk-input" data-keydown="onEnter" data-keydown-args='[{"$": "event"}, "addSettingsDictItem"]'
              data-i18n-placeholder="dictVariantsPh" placeholder="Как может распознаться: клод, klot" data-i18n-title="dictVariantsTip" title="Через запятую — как модель может услышать это слово">
            <input id="settings-dict-cat" type="text" class="tk-input" list="dc-groups" data-keydown="onEnter" data-keydown-args='[{"$": "event"}, "addSettingsDictItem"]'
              data-i18n-placeholder="rdSasDictCatPh" placeholder="Группа" data-i18n-title="rdSasDictCatPh" title="Группа">
            <datalist id="dc-groups"></datalist>
            <button id="settings-dict-add" data-click="addSettingsDictItem" class="tk-btn tk-btn-primary" data-i18n="rdSasDictAdd">Добавить</button>
          </div>
          <div id="settings-dict-dup" class="dict-dup hidden" role="status" data-i18n="rdSasDictDup">Это слово уже есть в словаре</div>
        </section>
        <!-- Corrections made by hand in the recordings, not in the dictionary yet -->
        <section id="dc-offers" class="pcard hidden"></section>
        <!-- The words: the groups as filters, each word with its variants, group, recordings, switch and menu -->
        <section id="dc-words" class="pcard"></section>
        <!-- The correction by sound (the setting dictionary_fuzzy) -->
        <section class="pcard">
          <h3 class="pcd-h"><span class="pcd-ic"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 7h10M18 7h2M4 17h4M12 17h8"/><circle cx="16" cy="7" r="2"/><circle cx="10" cy="17" r="2"/></svg></span><span class="pcd-t" data-i18n="dcCorrection">Исправление</span></h3>
          <label class="vs-row settings-toggle cursor-pointer text-xs text-apple-label">
            <span><span data-i18n="dictFuzzyToggle">Исправлять похожие по звучанию слова</span>
              <span class="block text-[11.5px] text-apple-tertiary leading-snug mt-0.5" data-i18n="dictFuzzyHint">После распознавания слово, которое звучит как слово из словаря, заменяется им.</span></span>
            <input type="checkbox" role="switch" class="vs-switch" id="set-dict-fuzzy" checked />
          </label>
        </section>
        <!-- What each feature is (static/js/features.js): every field has a use, none is required -->
        <section class="pcard">
          <h3 class="pcd-h"><span class="pcd-ic"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 12V5a1 1 0 011-1h7l8 8-8 8z"/><circle cx="8.5" cy="8.5" r="1.3"/></svg></span><span class="pcd-t" data-i18n="ftDictTitle">Фичи</span></h3>
          <p class="dc-note" data-i18n="ftDictDesc">Что это за фичи и как о них говорят.</p>
          <div class="flex items-center gap-2">
            <input id="ft-dict-new" type="text" maxlength="60" data-keydown="onEnter" data-keydown-args='[{"$": "event"}, "addDictFeature"]'
              data-i18n-placeholder="ftNewPh" placeholder="Новая фича…" data-i18n-title="ftNewPh" title="Новая фича…" class="tk-input flex-1 min-w-0">
            <button data-click="addDictFeature" class="tk-btn tk-btn-primary" data-i18n="ftCreate">Создать</button>
          </div>
          <div id="ft-dict-list" class="space-y-2 dc-ft-list"></div>
          <label class="vs-row settings-toggle cursor-pointer text-xs text-apple-label">
            <span><span data-i18n="ftSuggestToggle">Предлагать фичу новой записи</span>
              <span class="block text-[11.5px] text-apple-tertiary leading-snug mt-0.5" data-i18n="ftSuggestHint">По названию встречи, а если в нём фичи нет — моделью анализа.</span></span>
            <input type="checkbox" role="switch" class="vs-switch" id="set-feature-suggest" checked />
          </label>
        </section>
      </div></div>
    </div>
