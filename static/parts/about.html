<!-- The About window: part of static/index.html (assembled by app/page.py) -->
  <!-- About (openAbout in static/js/app.js): a click on the logo is a small easter egg, five quick clicks a big one -->
  <div id="modal-about" class="hidden fixed inset-0 modal-backdrop z-50 flex items-center justify-center p-4" data-click="closeModalOnBackdrop" data-click-args='[{"$": "event"}, "about"]'>
    <div tabindex="-1" data-autofocus class="about-card relative w-full max-w-lg bg-apple-card border apple-border rounded-2xl shadow-2xl overflow-hidden modal-card">
      <button data-click="closeModal" data-click-args='["about"]' data-i18n-title="tipCloseModal" title="Закрыть окно" data-i18n-aria="tipCloseModal" aria-label="Закрыть окно" class="dlg-x dlg-x-corner">✕</button>
      <div class="px-7 pt-7 pb-4 flex items-center gap-6">
        <button id="about-logo" data-click="aboutLogoClick" class="about-logo shrink-0" tabindex="-1" data-i18n-title="tipAboutLogo" title="Verbaliox">
          <img class="about-mark" src="/static/brand/logo-256.png" alt="" width="104" height="104" draggable="false">
        </button>
        <div class="min-w-0 space-y-1.5">
          <h3 class="text-[22px] font-semibold text-white tracking-tight leading-tight">Verbaliox <span id="about-version" class="text-apple-secondary font-medium"></span></h3>
          <p class="text-[13px] text-apple-label" data-i18n="aboutTagline">Локальная расшифровка встреч, переводы и анализ — без облака</p>
          <p id="about-stats" class="text-[13px] text-white font-medium"></p>
          <button data-click="openExternal" data-click-args='["https://github.com/pravken/Verbaliox"]' class="text-[13px] text-apple-blue hover:underline">github.com/pravken/Verbaliox</button>
        </div>
      </div>
      <div id="about-caption" class="about-caption px-7"></div>
      <!-- Credits the model licenses ask for (CC-BY-4.0: Parakeet; OpenMDW-1.1: Nemotron); the full table is in the README -->
      <p class="px-7 pt-1 text-[11.5px] leading-relaxed text-apple-secondary">
        <span data-i18n="aboutModels">Распознавание речи:</span> Whisper (OpenAI, MIT) · GigaAM v3 (Sber, MIT) ·
        <button data-click="openExternal" data-click-args='["https://huggingface.co/nvidia/parakeet-tdt-0.6b-v3"]' class="text-apple-blue hover:underline">Parakeet TDT 0.6B v3 by NVIDIA</button>
        (<button data-click="openExternal" data-click-args='["https://creativecommons.org/licenses/by/4.0/"]' class="text-apple-blue hover:underline">CC-BY-4.0</button>) ·
        <button data-click="openExternal" data-click-args='["https://huggingface.co/nvidia/Nemotron-3-Diarization"]' class="text-apple-blue hover:underline">Nemotron 3 Diarization by NVIDIA</button>
        (<button data-click="openExternal" data-click-args='["https://huggingface.co/nvidia/Nemotron-3-Diarization"]' class="text-apple-blue hover:underline">OpenMDW-1.1</button>) ·
        <button data-click="openExternal" data-click-args='["https://github.com/pravken/Verbaliox#licenses"]' class="text-apple-blue hover:underline" data-i18n="aboutLicenses">Все лицензии</button>
      </p>
      <div class="px-7 pb-6 pt-2 flex items-center gap-2">
        <button data-click="openSupport" class="ui-btn ui-btn-subtle h-9 px-4 gap-2">
          <svg class="w-3.5 h-3.5 text-[#FF5E5B]" fill="currentColor" viewBox="0 0 24 24"><path d="M12 21s-7.5-4.6-9.6-9.2C.9 8.4 2.9 4.5 6.6 4.5c2.1 0 3.6 1.2 4.4 2.5.8-1.3 2.3-2.5 4.4-2.5 3.7 0 5.7 3.9 4.2 7.3C19.5 16.4 12 21 12 21z"/></svg>
          <span data-i18n="aboutSupport">Поддержать</span>
        </button>
        <div class="flex-1"></div>
        <button data-click="openExternal" data-click-args='["https://github.com/pravken/Verbaliox/releases"]' class="ui-btn ui-btn-subtle h-9 px-4" data-i18n="aboutWhatsNew">Что нового</button>
      </div>
      <!-- The big easter egg: the room, transcribed. Plays to its end (a click does not stop it; it
           closes by itself, or with the window) -->
      <div id="about-egg" class="about-egg hidden">
        <div class="flex items-center gap-2 text-[11.5px] font-mono text-apple-red"><span class="about-rec-dot"></span><span>REC</span><span id="about-egg-timer">00:00</span></div>
        <div id="about-egg-lines" class="mt-3 space-y-1.5 font-mono text-[12px]"></div>
      </div>
    </div>
  </div>
