<!-- «Люди»: a section of the rail (static/js/people.js, docs/pult-plan.md stage 6): part of static/parts/workspace.html.
     The people and the departments on the left (a search, the ones picked can be merged), the card of the one
     chosen on the right: their open tasks, the recordings they spoke in, were named in or invited to. -->
    <div id="people-view" class="hidden flex-1 min-h-0 pv-view">
      <header class="tk-head tk-head-lt">
        <span class="tk-head-ic" aria-hidden="true"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round"><circle cx="9" cy="9" r="3.2"/><path d="M3.5 19c.8-3 3-4.5 5.5-4.5s4.7 1.5 5.5 4.5M16 6.5a3 3 0 010 5.5M17.5 14.6c1.6.6 2.6 2 3 4.4"/></svg></span>
        <h1 class="tk-title" data-i18n="rlPeople">Люди</h1>
        <p id="pv-sub" class="tk-sub"></p>
        <span class="tk-grow"></span>
        <button id="pv-merge" class="tk-btn hidden" data-click="peopleMergePicked" data-i18n-title="spMergeTip" title="Объединить выбранных"></button>
        <button class="tk-btn tk-btn-primary" data-click="peopleAdd"><svg class="vx-plus" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M12 5v14M5 12h14"/></svg><span data-i18n="pvAdd">Человек</span></button>
      </header>
      <div class="pv-body">
        <aside class="pv-side">
          <div class="pv-side-top">
            <div id="pv-tabs" class="tk-seg" role="radiogroup" data-i18n-aria="spDirWho" aria-label="Кто"></div>
            <label class="tk-search pv-search">
              <svg aria-hidden="true" width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="#8E8E93" stroke-width="2.2" stroke-linecap="round"><circle cx="11" cy="11" r="6.5"/><path d="M20 20l-4.2-4.2"/></svg>
              <input id="pv-q" type="search" data-input="onPeopleSearch" data-input-args='[{"$": "value"}]'
                     data-i18n-placeholder="pvSearch" placeholder="Найти человека" data-i18n-title="pvSearch" title="Найти человека">
            </label>
          </div>
          <div id="pv-list" class="pv-list"></div>
          <p class="pv-note" data-i18n="spVoiceLocal">Образцы голоса хранятся только на этом компьютере</p>
        </aside>
        <section id="pv-card" class="pv-card"></section>
      </div>
    </div>
