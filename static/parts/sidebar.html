<!-- The left sidebar: hardware, library tree: part of static/index.html (assembled by app/page.py) -->
  <!-- =========================================================================
       LEFT SIDEBAR (Hardware + Action Buttons + Recordings List)
       ========================================================================= -->
  <aside id="app-sidebar" class="relative bg-apple-sidebar border-r apple-border flex flex-col shrink-0 overflow-hidden" style="width: 312px;">
    <!-- Drag to change the sidebar width (double-click: back to the default) -->
    <div id="sidebar-resizer" class="sidebar-resizer" data-i18n-title="tipSidebarResize" title="Потяните, чтобы изменить ширину. Двойной щелчок — ширина по умолчанию"></div>

    <!-- No header of its own (asked by the user): the window's title bar shows the name and the icon;
         «О программе» and «Поддержать» are in Settings → Общие -->
    <div class="px-3.5 py-2.5 border-b apple-border shrink-0">
      <!-- Hardware: the processor, memory and video card, then the models in a frame of their own,
           split by where they run (renderVram in static/js/settings.js) -->
      <div id="hw-block" class="hw-block">
        <div id="sys-row" class="hidden space-y-1">
          <div class="hw-row" data-i18n-title="tipCpuUsage" title="Загрузка процессора всеми программами" id="cpu-cell">
            <span class="hw-label"><svg class="hw-icon" fill="none" stroke="currentColor" stroke-width="1.7" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M8.25 3v1.5M4.5 8.25H3m18 0h-1.5M4.5 12H3m18 0h-1.5m-15 3.75H3m18 0h-1.5M8.25 19.5V21M12 3v1.5m0 15V21m3.75-18v1.5m0 15V21m-9-1.5h10.5a2.25 2.25 0 002.25-2.25V6.75a2.25 2.25 0 00-2.25-2.25H6.75A2.25 2.25 0 004.5 6.75v10.5a2.25 2.25 0 002.25 2.25zm.75-12h9v9h-9v-9z"/></svg>CPU</span>
            <span id="cpu-name" class="hw-name truncate"></span>
            <span class="hw-bar"><span id="cpu-bar" class="bg-apple-green/70"></span></span>
            <span id="cpu-text" class="hw-value"></span>
          </div>
          <div class="hw-row" id="ram-cell">
            <span class="hw-label"><svg class="hw-icon" fill="none" stroke="currentColor" stroke-width="1.7" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M3 7.5h18v8.25H3V7.5zM6.75 10.5v2.25m3.75-2.25v2.25m3.75-2.25v2.25m3.75-2.25v2.25M6 15.75v2.25m4-2.25v2.25m4-2.25v2.25m4-2.25v2.25"/></svg>RAM</span>
            <span id="ram-name" class="hw-name truncate"></span>
            <span class="hw-bar"><span id="ram-bar" class="bg-apple-amber/70"></span></span>
            <span id="ram-text" class="hw-value"></span>
          </div>
        </div>
        <button data-click="openModal" data-click-args='["settings", "recognition"]' class="hw-row hw-row-btn" data-i18n-title="tipHwStatus" title="Открыть настройки оборудования и моделей ИИ">
          <span class="hw-label"><svg class="hw-icon" fill="none" stroke="currentColor" stroke-width="1.7" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M2.25 6.75h19.5v10.5H2.25V6.75zM4.5 17.25v2.25M9 13.875a1.875 1.875 0 100-3.75 1.875 1.875 0 000 3.75zM14.25 9.75h4.5m-4.5 2.25h4.5m-4.5 2.25h4.5"/></svg>GPU</span>
          <span class="hw-name"><span id="hw-dot" class="w-1.5 h-1.5 rounded-full bg-apple-green shrink-0"></span><span id="hw-text" class="truncate">…</span></span>
          <span class="hw-bar"><span id="vram-bar" class="bg-apple-blue/70"></span></span>
          <span id="vram-text" class="hw-value"></span>
        </button>
        <!-- The models: how many work and which; a click opens all of them beside the sidebar (#models-pop) -->
        <button id="vram-row" data-click="toggleModelsPop" data-click-args='[{"$": "event"}]' class="hidden hw-models-tile" aria-haspopup="dialog" aria-expanded="false"
          data-i18n-title="tipModelsTile" title="Все модели: какие работают, какие установлены и какие можно скачать">
          <span class="hw-tile-head">
            <svg class="tb-ai" viewBox="0 0 24 24" aria-hidden="true"><path d="M10 2l1.9 5.6 5.6 1.9-5.6 1.9L10 17l-1.9-5.6-5.6-1.9 5.6-1.9z"/><path d="M18.5 13l.9 2.6 2.6.9-2.6.9-.9 2.6-.9-2.6-2.6-.9 2.6-.9z"/></svg>
            <span class="hw-tile-title" data-i18n="mpTitle">Модели</span>
            <span id="hw-models-count" class="hw-models-count"></span>
            <svg class="hw-tile-chev" viewBox="0 0 24 24" aria-hidden="true"><path d="M9 6l6 6-6 6"/></svg>
          </span>
          <span id="hw-models-running" class="hw-tile-chips hidden"></span>
        </button>
      </div>
    </div>

    <!-- ===== Sidebar: library ===== -->
    <div id="side-library" class="flex-1 min-h-0 flex flex-col">

    <!-- Global Full-Text Search Across All Recordings -->
    <div class="px-3 pt-2.5 pb-1">
      <div class="flex items-center gap-1.5">
      <div class="relative flex-1 min-w-0">
        <svg class="w-3.5 h-3.5 text-apple-tertiary absolute left-2.5 top-1/2 -translate-y-1/2 pointer-events-none" fill="none" stroke="currentColor" stroke-width="1.8" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" d="M21 21l-5.197-5.197m0 0A7.5 7.5 0 105.196 5.196a7.5 7.5 0 0010.607 10.607z"/>
        </svg>
        <input id="global-search-input" type="text"
          data-input="handleGlobalSidebarSearch" data-input-args='[{"$": "value"}]'
          data-i18n-placeholder="globalSearchPlaceholder"
          data-i18n-title="tipGlobalSearch"
          title="Полнотекстовый поиск слова или фразы по всей медиатеке"
          placeholder="Поиск по всем записям…"
          class="w-full h-7 bg-white/5 focus:bg-apple-card border border-transparent focus:border-apple-blue/60 rounded-lg pl-8 pr-6 text-xs text-white placeholder-apple-tertiary focus:outline-none transition" />
      </div>
      <!-- The features: a button of their own (they were the first group of the funnel's long menu) -->
      <button id="lib-feature-btn" data-click="openLibFilterMenu" data-click-args='[{"$": "event"}, "feature"]'
        data-i18n-title="tipLibFeature" title="Показать только записи нужной фичи"
        class="lib-filter-btn" aria-haspopup="true" aria-expanded="false">
        <svg class="w-3.5 h-3.5" fill="none" stroke="currentColor" stroke-width="1.8" viewBox="0 0 24 24" aria-hidden="true"><path stroke-linejoin="round" d="M3.5 12.2V4.5a1 1 0 0 1 1-1h7.7l8.3 8.3a1 1 0 0 1 0 1.4l-7.3 7.3a1 1 0 0 1-1.4 0z"/><circle cx="8" cy="8" r="1.4" fill="currentColor" stroke="none"/></svg>
        <span id="lib-feature-count" class="lib-filter-count hidden"></span>
      </button>
      <!-- Filters of the library: type, source, state, what is ready, language (library.js, LIB_FILTERS) -->
      <button id="lib-filter-btn" data-click="openLibFilterMenu" data-click-args='[{"$": "event"}]'
        data-i18n-title="tipLibFilter" title="Показать только записи нужного типа, источника, состояния или языка"
        class="lib-filter-btn" aria-haspopup="true" aria-expanded="false">
        <svg class="w-3.5 h-3.5" fill="none" stroke="currentColor" stroke-width="1.8" viewBox="0 0 24 24" aria-hidden="true"><path stroke-linecap="round" stroke-linejoin="round" d="M3.75 5.25h16.5l-6.4 7.6v5.4l-3.7 1.5v-6.9z"/></svg>
        <span id="lib-filter-count" class="lib-filter-count hidden"></span>
      </button>
      </div>
      <div id="lib-filter-chips" class="hidden lib-filter-chips"></div>
    </div>

    <!-- Processing queue (shown only while something is queued or running) -->
    <div id="queue-panel" class="hidden mx-2.5 mt-1 mb-1 rounded-lg border apple-border bg-white/[0.03]">
      <div class="px-2.5 pt-2 pb-1 flex items-center justify-between">
        <span class="text-[11.5px] font-semibold text-apple-secondary uppercase tracking-wider whitespace-nowrap min-w-0 truncate">
          <span data-i18n="queueTitle">Очередь</span> <span id="queue-count" class="font-mono text-apple-blue"></span>
        </span>
        <!-- the whole queue at once (asked by the user: many files waiting) -->
        <span class="flex items-center gap-1 shrink-0">
          <button id="queue-pause-btn" data-click="toggleQueuePause" class="q-tool"></button>
          <button data-click="cancelWholeQueue" class="q-tool q-tool-danger" data-i18n-title="queueCancelAllTip" title="Отменить все задачи очереди">
            <svg aria-hidden="true" width="11" height="11" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><path d="M6 6l12 12M18 6L6 18"/></svg>
            <span data-i18n="queueCancelAll">Все</span>
          </button>
        </span>
      </div>
      <div id="queue-list" class="px-1.5 pb-1.5 space-y-1 max-h-48 overflow-y-auto"></div>
    </div>

    <!-- Sidebar Section Header -->
    <div class="px-4 pt-2 pb-1 flex items-center justify-between gap-2">
      <span class="text-[11.5px] font-semibold text-apple-secondary uppercase tracking-wider" data-i18n="recordings" data-i18n-title="rightClickHint" title="Правый клик — меню">Медиатека</span>
      <span class="flex items-center gap-1.5 min-w-0">
        <button id="lib-fold-btn" data-click="toggleLibraryFold" data-i18n-title="tipLibFoldAll" title="Свернуть всё"
          class="sb-icon-btn shrink-0 p-1 rounded-md text-apple-secondary hover:text-white hover:bg-white/10 transition"></button>
        <button id="lib-table-btn" data-click="toggleLibTable" data-i18n-title="tipLibTable" title="Таблица на всё окно: столбцы, сортировка, ширина" aria-pressed="false"
          class="sb-icon-btn shrink-0 p-1 rounded-md text-apple-secondary hover:text-white hover:bg-white/10 transition">
          <svg class="w-3.5 h-3.5" fill="none" stroke="currentColor" stroke-width="1.8" viewBox="0 0 24 24" aria-hidden="true"><rect x="3.5" y="4.5" width="17" height="15" rx="2"/><path d="M3.5 9.5h17M9.5 9.5v10"/></svg>
        </button>
        <button data-click="openLibViewMenu" data-click-args='[{"$": "event"}]' data-i18n-title="tipLibView" title="Вид и сортировка"
          class="sb-icon-btn shrink-0 p-1 rounded-md text-apple-secondary hover:text-white hover:bg-white/10 transition">
          <svg class="w-3.5 h-3.5" fill="none" stroke="currentColor" stroke-width="1.8" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M3 7.5L7.5 3m0 0L12 7.5M7.5 3v13.5m13.5 0L16.5 21m0 0L12 16.5m4.5 4.5V7.5"/></svg>
        </button>
        <button data-click="createFolderPrompt" data-click-args='[null]' data-i18n-title="tipNewFolder" title="Новая папка"
          class="sb-icon-btn shrink-0 p-1 rounded-md text-apple-secondary hover:text-white hover:bg-white/10 transition">
          <svg class="w-3.5 h-3.5" fill="none" stroke="currentColor" stroke-width="1.8" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M12 10.5v6m3-3H9m4.06-7.19l-2.12-2.12a1.5 1.5 0 00-1.061-.44H4.5A2.25 2.25 0 002.25 6v12a2.25 2.25 0 002.25 2.25h15A2.25 2.25 0 0021.75 18V9a2.25 2.25 0 00-2.25-2.25h-5.379a1.5 1.5 0 01-1.06-.44z"/></svg>
        </button>
      </span>
    </div>

    <!-- Recordings in folders (drag recordings and folders to sort them; right-click for the menu) -->
    <div id="meetings-list" class="flex-1 overflow-y-auto px-2.5 py-1 space-y-0.5"
      data-dragover="libraryDragOver" data-dragover-args='[{"$": "event"}, null]' data-dragleave="libraryDragLeave" data-dragleave-args='[{"$": "event"}]' data-drop="libraryDrop" data-drop-args='[{"$": "event"}, null]'>
      <!-- Populated dynamically -->
    </div>
    </div>

    <!-- Background Model Download Widget (Docked in Sidebar so user can work freely while downloading) -->
    <div id="sidebar-download-widget" class="hidden mx-2.5 mb-2 rounded-xl bg-apple-card/95 border border-apple-blue/35 p-2.5 space-y-2 shadow-lg shrink-0">
      <div class="flex items-center justify-between gap-1.5">
        <div class="flex items-center gap-1.5 min-w-0">
          <span class="w-2 h-2 rounded-full bg-apple-blue animate-pulse shrink-0"></span>
          <span id="sidebar-dl-title" class="text-[11.5px] font-semibold text-white truncate" data-i18n="dlModelTitle">Загрузка модели…</span>
        </div>
        <div class="flex items-center gap-1.5 shrink-0">
          <span id="sidebar-dl-pct" class="text-[11.5px] font-mono font-semibold text-apple-blue">0%</span>
          <button data-click="toggleSidebarDownloadLogs"
            data-i18n-title="tipToggleDlLogs"
            title="Показать или скрыть подробный лог скачивания"
            class="px-1.5 py-0.5 rounded bg-white/5 hover:bg-white/10 text-[11px] text-apple-secondary hover:text-white transition"
            data-i18n="logsBtn">Журнал</button>
        </div>
      </div>

      <div class="w-full h-1.5 bg-white/10 rounded-full overflow-hidden">
        <div id="sidebar-dl-bar" class="h-full bg-apple-blue transition-all duration-300" style="width: 2%"></div>
      </div>

      <div id="sidebar-dl-status" class="text-[11px] text-apple-secondary truncate" data-i18n="dlPreparingShort">Подготовка…</div>

      <div id="sidebar-dl-logs" class="hidden max-h-24 overflow-y-auto overflow-x-hidden font-mono text-[11px] text-apple-secondary space-y-0.5 bg-black/40 rounded-lg p-2 border apple-border break-all whitespace-pre-wrap">
      </div>
    </div>

    <!-- A new version: stays in sight until it is installed (app.js renderUpdateStatus) -->
    <button id="upd-pill" data-click="openUpdateDialog" class="upd-pill hidden" type="button">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 19V5M6 11l6-6 6 6"/></svg>
      <span id="upd-pill-text" class="truncate"></span>
    </button>
  </aside>
